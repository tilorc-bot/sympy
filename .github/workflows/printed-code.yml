# Compile the C, C++ and Rust code that a pull request's printer tests print,
# if the merge base did not already print it. See
# sympy/testing/check_printed_code.py.

name: printed code

on:
  pull_request:
    paths:
      - 'sympy/printing/**'
      - 'sympy/codegen/**'
      - 'sympy/utilities/codegen.py'
      - 'sympy/testing/check_printed_code.py'
      - 'sympy/testing/tests/test_check_printed_code.py'
      - '.github/workflows/printed-code.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The tests that print C, C++ or Rust code
  TESTS: >-
    sympy/printing sympy/codegen
    sympy/utilities/tests/test_codegen.py sympy/utilities/tests/test_codegen_rust.py

jobs:
  compile:
    name: Printed code compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The whole history, to find the merge base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install mpmath pytest hypothesis

      - name: Show the compilers (preinstalled on the runner)
        run: gcc --version && g++ --version && rustc --version

      - name: Check out the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add ../base "$(git merge-base "$BASE_SHA" HEAD)"

      # The merge base might not have the plugin, or an older version of it,
      # so the pull request's version is copied in.
      - name: Record the printed code of the merge base
        run: |
          cp sympy/testing/check_printed_code.py ../base/sympy/testing/
          cd ../base
          # shellcheck disable=SC2086 # split $TESTS into paths
          python -m pytest -p sympy.testing.check_printed_code --printed-code=../base.json $TESTS

      - name: Record the printed code of the pull request
        run: |
          # shellcheck disable=SC2086 # split $TESTS into paths
          python -m pytest -p sympy.testing.check_printed_code --printed-code=../head.json $TESTS

      - name: Compile the new printed code
        run: python -m sympy.testing.check_printed_code ../base.json ../head.json
